<ng-map center='{{center}}' zoom-to-include-markers="true">
  <!-- map-data load-geo-json=""></map-data -->
  <!-- ng-transclude></ng-transclude -->
  <custom-marker position="[{{f.lat}}, {{f.lng}}]" ng-repeat="f in features">
    <div class="custom-marker">
      <span class="des">LINEA:          </span><span class="inf">{{f.linea}}  </span><br />
      <span class="des">Velocit&agrave;:</span><span class="inf">{{f.speed}}  </span><br />
      <span class="des">Bus ID:         </span><span class="inf">{{f.veicolo}}</span><br />
    </div>
  </custom-marker>
</ng-map>
