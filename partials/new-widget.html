<link rel='stylesheet' type='text/css' href='css/new-widget.css'>

<div style='margin: 10px;'>
  <form>
    <label for='identifier'>Identifier</label>
    <input name='identifier' type='text' ng-model='config.identifier' />
    <br />

    <label for='identifier'>Title</label>
    <input name='identifier' type='text' ng-model='config.title' />
    <br />

    <label for='identifier'>URL</label>
    <input name='identifier' type='text' ng-model='config.url' />
    <br />

    <label for='identifier'>URL Title</label>
    <input name='identifier' type='text' ng-model='config.urlTitle' />
    <br />

    <label for='identifier'>Help Doc URL</label>
    <input name='identifier' type='text' ng-model='config.helpDocUrl' />
    <br />

    <label for='identifier'>Width (Units)</label>
    <input name='identifier' type='text' ng-model='config.width' />
    <br />

    <label for='identifier'>Height (Units)</label>
    <input name='identifier' type='text' ng-model='config.height' />
    <br />

    <!-- <label>Widget Elements</label>
    <ul>
      <li ng-repeat='widgetElement in config.widgetElements track by $index'>
        {{widgetElement.name}} <a href='#'>x</a>
      </li>
    </ul>
    <select ng-options='i as widgetElement.name for (i, widgetElement) in widgetElementConfigs' ng-model='selectedWidgetElementIndex' style='margin-left: 25px;'></select>
    <button ng-click='addWidgetElement(selectedWidgetElementIndex)'>+</button> -->
  </form>

  <br />

  <div class="modal fade sample-widget-help">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
          <h4 class="modal-title">{{config.title}} Help</h4>
        </div>
        <div class="modal-body">
          <iframe ng-src="{{trustSrc(config.helpDocUrl)}}" scrolling="yes" width=850 height=470></iframe>
        </div>
      </div>
    </div>
  </div>

  <div gridster="gridsterOpts" style='height: auto;'>
    <ul>
      <li gridster-item row="0" col="0" size-x="{{config.width}}" size-y="{{config.height}}">
        <div class="widget">
          <div class="widget-heading">
            {{config.title}} <span ng-show='config.urlTitle'>(<a href='{{config.url}}' target='_new'>{{config.urlTitle}}</a>)</span>
          </div>
          <div class="widget_content">
            <div class="btn-group" style="float:right;">
              <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" style='border:none; background:transparent; padding:0;'>
                <span class="glyphicon glyphicon-chevron-down" style='font-size: 12px;'></span>
              </button>
              <ul class="dropdown-menu" style='left:-142px;'>
                <li><a ng-click='showHelp()' data-target='modal' data-target='.sample-widget-help'><span class="glyphicon glyphicon-info-sign glyphicon-small"></span> About</a></li>
              </ul>
            </div>
            <br /><br />
            <div ng-repeat='widgetElement in config.widgetElements track by $index' ng-bind-html='htmlSafe(widgetElementContent($index))'></div>
          </div>
        </div>
      </li>
    </ul>
  </div>

  <button ng-click='saveWidget()'>Save Widget</button>

  <br /><br />

  <a href='/#/'>Back</a>
</div>
