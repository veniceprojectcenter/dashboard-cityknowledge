<div class="container">
  <nav class="navbar navbar-default" role="navigation">
    <div class="container-fluid">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="#">CityKnowledge Dashboards</a>
      </div>
      <div id="navbar" class="navbar-collapse collapse">
        <ul class="nav navbar-nav">
          <!-- <li class="active"><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li> -->
        </ul>
        <ul class="nav navbar-nav navbar-right">
          <li class="dropdown" ng-show='loggedIn'>
            <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-expanded="false">admin@cityknowledge.net</a>
            <ul class="dropdown-menu" role="menu">
              <li><a href="#" ng-click='logout()'>Sign Out</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="jumbotron">
    <div class="row" ng-show='loggedIn'>
      <div class="col-md-5">
        <h3>Dashboards</h3>
        <ul>
          <li ng-repeat="dashboard in dashboards | orderBy:'name'">
            <a href='/#/{{dashboard.url}}'>{{dashboard.name}}</a>
          </li>
        </ul>

        <br />

        <label for='dashboard'>Name:</label>
        <input type='text' name='dashboard' ng-model='dashboardName' />
        <button ng-click='createDashboard()'>Create Dashboard</button>
      </div>

      <div class="col-md-1" />

      <div class="col-md-6">
        <h3>Widgets</h3>
        <ul>
          <li ng-repeat="widget in dashboardWidgets | orderBy: 'title'">
            <a href='#'>{{widget.title}}</a> [<a href='#'>X</a>]
          </li>
        </ul>

        <br />

        <a href='/#/widgets/new' style='color: #000;'>
          <button>Create Widget</button>
        </a>
      </div>
    </div>

    <div class="row" ng-show='!loggedIn'>
      <div class="col-md-4" />
      <div class="col-md-4">
        <form class="form-signin" role="form">
          <h2 class="form-signin-heading">Please sign in</h2>
          <label for="inputEmail" class="sr-only">Email address</label>
          <input type="email" id="inputEmail" class="form-control" placeholder="Email address" required autofocus ng-model='user.email'>
          <label for="inputPassword" class="sr-only">Password</label>
          <input type="password" id="inputPassword" class="form-control" placeholder="Password" required ng-model='user.password'>
          <!-- <div class="checkbox">
            <label>
              <input type="checkbox" value="remember-me"> Remember me
            </label>
          </div> -->
          <br />
          <button class="btn btn-lg btn-primary btn-block" type="submit" ng-click='attemptLogin()'>Sign in</button>
        </form>
      </div>
      <div class="col-md-4" />
    </div>
  </div>

</div>
