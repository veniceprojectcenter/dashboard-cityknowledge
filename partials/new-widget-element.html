<div style='margin: 10px;'>
  <form>
    <label for='identifier'>Type</label>
    <select ng-options='i as widgetElement.name for (i, widgetElement) in widgetElements' ng-model='i'></select>
    <br />

    <div ng-repeat="option in widgetElements[i].config">
      <label>{{option.label}}</label>
      <input type='{{option.type}}'></text>
    </div>

    <br />
    <button ng-click='saveWidget()'>Save Widget Element</button>
  </form>

  <br />

  <a href='/#/'>Back</a>
</div>
