
<html>
<head> 
	<meta charset="utf-8">
    <link rel="stylesheet" href="http://code.jquery.com/ui/1.7.0/themes/base/jquery-ui.css" />
    
    <script src="http://code.jquery.com/jquery-1.7.min.js" ></script>
    <script src="http://code.jquery.com/ui/1.7.0/jquery-ui.js" ></script>
 
<style type="text/css">
#map {
    width: 100%;
    height: 100%;
    border: 0px;
    padding: 0px;
    position: absolute;
}

body {
    border: 0px;
    margin: 0px;
    padding: 0px;
    height: 100%;
    font-family: sans-serif;
}

 
 

a:link, a:visited, a:hover, a:active {
    /*color: #00008a;*/
    color: #9e9eff;
}
</style>
 
</head>

<body  onload="init()">
  

<div id="myTabs"> 
      <ul>
        <li><a href="#a">Radar</a></li>
    	<li><a href="#b">Meteo</a></li>
      </ul>
      <div id="a">
      	<div id="basicMap"></div>
      </div>
      <div id="b"> 
        METEO
      </div>
</div>


</body>

<script src="http://openlayers.org/api/2.12/OpenLayers.js"></script>
<script src="http://openweathermap.org/js/OWM.OpenLayers.1.3.4.js" ></script>

<script type="text/javascript">
 $(function(){   
 	  
        $("#myTabs").tabs();
  });
      
var map;
function init() {

	//Maps Center 
	var lat = 7486473; 
	var lon = 4193332;
	var lonlat = new OpenLayers.LonLat(lon, lat);

    map = new OpenLayers.Map("basicMap");

	// Create overlays

	// OSM layer
    var mapnik = new OpenLayers.Layer.OSM();
	// stations layer
	var stations = new OpenLayers.Layer.Vector.OWMStations("Stations");
	// weather layer
	var city = new OpenLayers.Layer.Vector.OWMWeather("Weather");

	//connect layers to map
	map.addLayers([mapnik, stations, city]);

	//Add Layers swither
	map.addControl(new OpenLayers.Control.LayerSwitcher());       	

	map.setCenter( lonlat, 10 );

	// Add popups 
	selectControl = new OpenLayers.Control.SelectFeature([city,stations]);
	map.addControl(selectControl);
	selectControl.activate(); 


}

</script>
 

</html>
