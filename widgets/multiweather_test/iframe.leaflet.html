
<html>
<head> 
	<meta charset="utf-8">
    <script type="text/javascript" src="leaflet/leaflet.js"></script>
    <link rel="stylesheet" type="text/css" href="leaflet/leaflet-openweathermap.css" />
    <script type="text/javascript" src="leaflet/leaflet-openweathermap.js"></script>
 
</head>

<body  onload="init()">
  <div id="basicMap"></div>

</body>

 
<script type="text/javascript">
 
      
var map;
function init() {

	//Maps Center 
	var lat = 7486473; 
	var lon = 4193332; 
	 
      
     function myOwmMarker(data) {
        // just a Leaflet default marker
        return L.marker([data.coord.lat, data.coord.lon]);
    }
    
    function myOwmPopup(data) {
        // just a Leaflet default popup with name as content
        return L.popup().setContent(data.name);
    }
    
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18, attribution: '[insert correct attribution here!]' });
    
    var clouds = L.OWM.clouds({showLegend: false, opacity: 0.5});
    var city = L.OWM.current({intervall: 15, lang: 'de',
                markerFunction: myOwmMarker, popupFunction: myOwmPopup});
    
    var map = L.map('basicMap', { center: new L.LatLng(51.5, 10), zoom: 10, layers: [osm] });
    var baseMaps = { "OSM Standard": osm };
    var overlayMaps = { "Clouds": clouds, "Cities": city };
    var layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);
  
 
}

</script>
 

</html>
