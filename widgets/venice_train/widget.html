<script src="widgets/venice_train/venice_train.js"></script>

<style>
.row-nopad {
	margin-left: -7px;
	margin-right: -7px;
}

.row-nopad > div {
	padding: 0;
}

.train-table > thead > tr > th {
	border-bottom: 0;
}

.flappy-row {
	background-color: #111;
	display: flex;
	align-items: flex-start;
	align-content: flex-start;
	flex-flow: row wrap;
}

.flappy-row + .flappy-row {
	border-top: 1px solid #363636;
}

.flappy {
	background-color: #222;
	color: #fff;
	flex: 1;
	font-family: "Roboto Slab", courier new, courier, monospace;
	font-size: 12px;
	padding: 4px 0;
	text-align: center;
	text-transform: uppercase;
}

.flappy + .flappy {
	border-left: 1px solid #363636;
}

.flappy:nth-child(5),
.flappy:nth-child(17),
.flappy:nth-child(19) {
	border-right: 1px solid #363636;
	margin-right: 10px;
}
</style>

<div ng-controller="VeniceTrainController"  ng-init="initController(widget)">
	<div class="row text-center" style="margin-top: 3em;">
		<div class="col-xs-4" style="font-size: 1.4em; font-weight: bold;">
			Total Tourists
		</div>
		<div class="col-xs-4" style="font-size: 1.4em; font-weight: bold;">
			Overnighters
		</div>
		<div class="col-xs-4" style="font-size: 1.4em; font-weight: bold;">
			Daytrippers
		</div>
	</div>
	<div class="row text-center space-top-sm">
		<div class="col-xs-4">
			<div class="datum-box -navy -lg" style="padding: 5px 0; font-size: 18px;">
				<strong>{{tourists | number}}</strong>
			</div>
		</div>
		<div class="col-xs-4">
			<div class="datum-box -green -lg" style="padding: 5px 0; font-size: 18px;">
				<strong>{{overnighters | number}}</strong>
			</div>
		</div>
		<div class="col-xs-4">
			<div class="datum-box -blue -lg" style="background-color: #0098D4; padding: 5px 0; font-size: 18px;">
				<strong>{{daytrippers | number}}</strong>
			</div>
		</div>
	</div>
	
	<div class="row text-center row-nopad space-top-lg space-bottom-sm" style="margin-top: 3.5em;">
		<div class="col-xs-3" style="font-size: 1.2em; font-weight: bold;">Arrival Time</div>
		<div class="col-xs-6" style="font-size: 1.2em; font-weight: bold;">Provenance</div>
		<div class="col-xs-1" style="font-size: 1.2em; font-weight: bold;">Track</div>
		<div class="col-xs-2" style="font-size: 1.2em; font-weight: bold;">PAX</div>
	</div>
	
	<div ng-repeat="(key, value) in non_null_tracks" ng-bind-html="value.row | unsafe" class="flappy-row">
	</div>
	
	<div class="row text-center" style="margin-top: 6em;">
		<div class="col-xs-6" style="font-size: 1.4em; font-weight: bold;">Total Arrivals</div>
		<div class="col-xs-6" style="font-size: 1.4em; font-weight: bold;">Commuters</div>
	</div>
	<div class="row text-center space-top-sm">
		<div class="col-xs-6">
			<div class="datum-box -lg" style="padding: 5px 0; font-size: 18px;">
				<strong>{{arrived_so_far | number}}</strong>
			</div>
		</div>
		<div class="col-xs-6">
			<div class="datum-box -lg" style="padding: 5px 0; font-size: 18px;">
				<strong>{{commuters | number}}</strong>
			</div>
		</div>
	</div>
</div>
