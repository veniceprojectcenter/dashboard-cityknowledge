	var passengerRef = new Firebase('https://vpc.firebaseio.com').child('dashboard/flights/passenger_ref');
		passengerRef.on('value', function(dataSnap) {
			var venice_airport_arrivals = dataSnap.val();
		var cruiseRef = new Firebase('https://vpc.firebaseio.com').child('dashboard/ships/tourists');
		cruiseRef.on('value', function(dataSnap) {
			var air_arrivals = Math.floor(venice_airport_arrivals + venice_airport_arrivals * 0.389);
			var cruise_arrivals = dataSnap.val();
			var max_occupancy = 23733;
			var estimated_hotels = Math.floor(max_occupancy * month_multiplier(new Date().getMonth() + 1) * day_multiplier(new Date().getDay()));

			var air_overnights = Math.floor((1262000/3450000) * air_arrivals);
			var train_overnights = Math.floor((1347000/5879000) * estimated_hotels);
			var auto_overnights = Math.floor((268000/5879000) * estimated_hotels);
			var coach_overnights = Math.floor((365000/5879000) * estimated_hotels);
			var bus_overnights = Math.floor((120000/5879000) * estimated_hotels);
			var cruise_overnights = Math.floor(((514000+329000)/239000) * cruise_arrivals);
			var boat_overnights = 0;

			var air_daytrips = 0;
			var train_daytrips = Math.floor(((450000+6670000)/1347000) * train_overnights);
			var auto_daytrips = Math.floor((751000/268000) * auto_overnights);
			var coach_daytrips = Math.floor(((547000+1787000)/365000) * coach_overnights);
			var bus_daytrips = Math.floor(((1110000+600000)/120000) * bus_overnights);
			var cruise_daytrips = 0;
			var boat_daytrips = Math.floor((466000+160000+2235000)/(450000+6670000+751000+547000+1787000+1110000+600000+466000+160000+2235000) * (train_daytrips + auto_daytrips + coach_daytrips + bus_daytrips + cruise_daytrips));

			var train_arrivals = Math.floor((509000/1347000) * train_overnights + train_overnights + train_daytrips);
			var auto_arrivals = Math.floor((95000/268000) * auto_overnights + auto_overnights + auto_daytrips);
			var coach_arrivals = Math.floor((131000/365000) * coach_overnights + coach_overnights + coach_daytrips);
			var bus_arrivals = Math.floor((44000/120000) * bus_overnights + bus_overnights + bus_daytrips);
			var boat_arrivals = boat_daytrips;

			var total_arrivals = air_arrivals + cruise_arrivals + train_arrivals + auto_arrivals + bus_arrivals + coach_arrivals + boat_arrivals;
			var total_overnights = air_overnights + cruise_overnights + train_overnights + auto_overnights + bus_overnights + coach_overnights + boat_overnights;
			var total_daytrips = air_daytrips + cruise_daytrips + train_daytrips + auto_daytrips + bus_daytrips + coach_daytrips + boat_daytrips;

			

		var fb = new Firebase('https://fiery-heat-9640.firebaseio.com');

			var strOvernights = snapshot.val();
			var myOvernights = parseFloat(strOvernights);
		
		fb.child('modrevenue/0').on('value', function(snapshot) {

			var getHotelO = parseFloat(json.hotelsovernight);
			var mathHotelO = Math.floor(getHotelO * myOvernights);
			var hotelsovernight = replaceNumberWithCommas(mathHotelO);
			
			
			var getHotelD = parseFloat(json.hotelsdaytrip);
			var mathHotelD = Math.floor(getHotelD * total_daytrips);
			var hotelsdaytrip = replaceNumberWithCommas(mathHotelD);
			
			
			var hotelsrevenue = replaceNumberWithCommas(mathHotelD + mathHotelO);
			
			
			
			
			
			var getStoresO = parseFloat(json.storesovernight);

			var storesdaytrip = replaceNumberWithCommas(mathStoresD);
			
			
			var storesrevenue = replaceNumberWithCommas(mathStoresD + mathStoresO);
			
			
			
			
			
			var getFoodO = parseFloat(json.foodovernight);
			var mathFoodO = Math.floor(getFoodO * myOvernights);
			var foodovernight = replaceNumberWithCommas(mathFoodO);
			
			var getFoodD = parseFloat(json.fooddaytrip);
			var mathFoodD = Math.floor(getFoodD * total_daytrips);
			var fooddaytrip = replaceNumberWithCommas(mathFoodD);
			
			var foodrevenue = replaceNumberWithCommas(mathFoodO + mathFoodD);
			
			
			
			
			var getTaxiO = parseFloat(json.taxiovernight);

			var gondolaovernight = replaceNumberWithCommas(mathGondO);

			var gondoladaytrip = replaceNumberWithCommas(mathGondD);
			
			var gondolarevenue = replaceNumberWithCommas(mathGondO + mathGondD);
			
			
			
			
			var getActvO = parseFloat(json.actvovernight);
			var mathActvO = Math.floor(getActvO * myOvernights);
			var actvovernight = replaceNumberWithCommas(mathActvO);
			//document.getElementById("actvovernight").innerHTML = actvovernight;
			
			var getActvD = parseFloat(json.actvovernight);

			var actvdaytrip = replaceNumberWithCommas(mathActvD);
			//document.getElementById("actvdaytrip").innerHTML = actvdaytrip;
			
			var actvrevenue = replaceNumberWithCommas(mathActvO + mathActvD);
			//document.getElementById("actvrevenue").innerHTML = actvrevenue;
			
			
			
			
			var getAliO = parseFloat(json.aliovernight);
			var mathAliO = Math.floor((getAliO * myOvernights) + mathActvO);
			var aliovernight = replaceNumberWithCommas(mathAliO);
			
			var getAliD = parseFloat(json.alidaytrip);
			var mathAliD = Math.floor((getAliD * total_daytrips) + mathActvD);
			var alidaytrip = replaceNumberWithCommas(mathAliD);
			
			var alirevenue = replaceNumberWithCommas(mathAliO + mathAliD);
			
			
			
			var mathORev = (mathAliO + mathGondO + mathTaxiO + mathHotelO + mathStoresO + mathFoodO);
			var overnightrevenue = replaceNumberWithCommas(mathORev);
			document.getElementById("overnight_revenue").innerHTML = overnightrevenue;
			
			var mathDRev = (mathAliD + mathGondD + mathTaxiD + mathHotelD + mathStoresD + mathFoodD);
			var daytriprevenue = replaceNumberWithCommas(mathDRev);
			document.getElementById("daytrip_revenue").innerHTML = daytriprevenue;
			
			var totalrevenue = replaceNumberWithCommas(mathORev + mathDRev);
			document.getElementById("total_revenue").innerHTML = totalrevenue;
			
			


		fb.child('TCD').on('value', function(snapshot) {

		var sewage_revenue = replaceNumberWithCommas(mathSewageO + mathSewageD);
		
		
		
		
		
		var getMotoO = parseFloat(json.mo_overnight);
		var mathMotoO = Math.floor(getMotoO * myOvernights);
		var mo_overnight = replaceNumberWithCommas(mathMotoO);
		
		var getMotoD = parseFloat(json.mo_daytrip);
		var mathMotoD = Math.floor(getMotoD * total_daytrips);
		var mo_daytrip = replaceNumberWithCommas(mathMotoD);
		
		var mo_revenue = replaceNumberWithCommas(mathMotoO + mathMotoD); 
		
		
			
		var plusTcdO = (mathOtherO + mathVatO + mathHotelTaxO);
		var minusTcdO = (mathGarbageO + mathSewageO + mathMotoO);
		var mathTcdO = (plusTcdO - minusTcdO);
		var tcd_overnight = replaceNumberWithCommas(mathTcdO);
		document.getElementById("tcd_overnight").innerHTML = tcd_overnight;
		
		var plusTcdD = (mathOtherD + mathVatD + mathHotelTaxD);
		var minusTcdD = (mathGarbageD + mathSewageD + mathMotoD);
		var mathTcdD = (plusTcdD - minusTcdD);
		var tcd_daytrip = replaceNumberWithCommas(mathTcdD);
		document.getElementById("tcd_daytrip").innerHTML = tcd_daytrip;
		
		var tcd_revenue = replaceNumberWithCommas(mathTcdD + mathTcdO);
		document.getElementById("tcd_revenue").innerHTML = tcd_revenue;
		

		document.getElementById("taxes_overnight").innerHTML = replaceNumberWithCommas(plusTcdO);
		document.getElementById("taxes_daytrip").innerHTML = replaceNumberWithCommas(plusTcdD);
		document.getElementById("taxes_revenue").innerHTML = replaceNumberWithCommas(plusTcdD + plusTcdO);
		
		document.getElementById("costs_overnight").innerHTML = replaceNumberWithCommas(minusTcdO);
		document.getElementById("costs_daytrip").innerHTML = replaceNumberWithCommas(minusTcdD);
		document.getElementById("costs_revenue").innerHTML = replaceNumberWithCommas(minusTcdD + minusTcdO);
		
		document.getElementById("numb_overnight").innerHTML = replaceNumberWithCommas(Math.floor(myOvernights));
		document.getElementById("numb_daytrip").innerHTML = replaceNumberWithCommas(total_daytrips);
		document.getElementById("numb_revenue").innerHTML = replaceNumberWithCommas(Math.floor(myOvernights + total_daytrips));
});
		});

		});
		function month_multiplier(month) {
			if (month == 1)
				return 0.54;
			if (month == 2)
				return 0.69;
			if (month == 3)
				return 0.87;
			if (month == 4)
				return 0.90;
			if (month == 5)
				return 0.87;
			if (month == 6)
				return 0.90;
			if (month == 7)
				return 0.85;
			if (month == 8)
				return 0.80;
			if (month == 9)
				return 0.80;
			if (month == 10)
				return 0.69;
			if (month == 11)
				return 0.59;
			if (month == 12)
				return 0.44;
			return 0.70;
		}

		function day_multiplier(day) {
			if (day == 0 || day == 5 || day == 6) // weekend
				return 1;
			else // weekday
				return 0.46;
		}
		
		function replaceNumberWithCommas(yourNumber) {
		    //Seperates the components of the number
		    var n= yourNumber.toString().split(".");
		    //Comma-fies the first part
		    n[0] = n[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
		    //Combines the two sections
		    return n.join(".");
		}	
});
