 
<link rel="stylesheet" href="widgets/hotelsmap/openlayers/ol.css" type="text/css">

<style>
.map           { width:100%; height:100%; margin:0; }   
#map           { width:100%; height:100%; margin:0; }
#toolbox       { position:absolute; bottom:50px; left:8px; padding:3px; border-radius:4px; color:#fff; background: rgba(255, 255, 255, 0.4); z-index:100; }
#layerswitcher { margin:0; padding:10px; border-radius:4px; background:rgba(0, 60, 136, 0.5); list-style-type:none; } 
</style>

<script src="widgets/hotelsmap/hotelsmap.js"></script>
 
<div ng-controller="HotelsMapPortController"  ng-init="initController(widget)" >
   <div id="widget_{{widget.fb_id}}" > 

       <div style="height: 320px; width:371px; overflow-y: hidden; float:left;" >  
               
                <div  class="map" style="height: 300px; "  id="map_canvas_{{widget.fb_id}}"></div>  
                <div id="toolbox">
                    <ul id="layerswitcher"> 
                    <li><label><input type="radio" name="layer" value="1"> Booking</label></li>
                    <li><label><input type="radio" name="layer" value="2"> AirBnb</label></li> 
                    </ul>
                 </div>
       </div>  
        
  </div>
</div>
