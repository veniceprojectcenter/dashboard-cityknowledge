<script src="widgets/multicam/multicam.js"></script>

<br />
<div id="widget_{{widget.fb_id}}" > 

     <div zstyle="height: 340px; width:371px; overflow-y: scroll;"
          style="overflow-y: scroll;"
          id="container_{{widget.fb_id}}">
           <div ng-controller="MulticamController"  ng-init="initController(widget)" >
              <span ng-repeat="immagine in multicam_photos_db "
                    ng-if="$index >= indice && $index < (indice+tot_images_per_page) "
                    style="position: relative">
                <img style="border: 1px solid;"
                     class="imagedialog"
                     ng-click="openMulticamImage(immagine.name,immagine.url)"
                     width="{{image_width}}"
                     src="{{immagine.url}}"
                     alt="{{immagine.name}}"
                     title="{{immagine.name}}" />
                <span style="position: absolute;
                     left: 0px;
                     width: 100%;
                     height: 20px;
                     font-weight: bold;
                     background: #fff;
                     color: #000;
                     font-size: 72%;
                     filter: alpha(opacity=40);
                     -moz-opacity: .4;
                     opacity: 0.8;
                     overflow-x: hidden;
                     white-space: nowrap;
                     padding: 4px;">{{immagine.name}}</span>
              </span>
          </div> 
     </div>  
    <div class="modal fade " id="imagemodal" tabindex="10" role="dialog"   aria-hidden="true" style="z-index:10">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
            <h4 class="modal-title" id="imagemodal_title">Webcam  preview</h4>
          </div>
          <div class="modal-body">
            <center><img src="" id="imagepreview" style="width: 100%; height: 100%;" ></center>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

</div>
