<script src="widgets/airbnbtop/airbnbtop.js" type="text/javascript"></script>
  
 
 <div ng-controller="VeniceAirbnbtopController"  ng-init="initController(widget)"  >
    <br/><br/>
 
    <div class="row text-center">
      
        <div class="col-xs-4" style="font-size: 1em; font-weight: bold;">
            <div class="datum-box -lg" style="background-color: #FF2828; font-size: 18px;">
            VENICE
            </div>
        </div>
        
        <div class="col-xs-4" style="font-size: 1em; font-weight: bold;">
            <div class="datum-box -lg" style="background-color: #FF2828; font-size: 18px;">
            ISLANDS
            </div>
        </div>
       
        <div class="col-xs-4" style="font-size: 1em; font-weight: bold;">
            <div class="datum-box -lg" style="background-color: #FF2828; font-size: 18px;">
            MAINLAND
           </div>
        </div>          
    </div>
   
     
    <div class="row text-left">
       
        <div class="col-xs-4" style="font-size: 1em; font-weight: bold;">
                
                <tag ng-repeat="owner in airbnb_values.top10_ve | limitTo:10  track by $index    " > 
                
                      <br>&nbsp;<a target="_blank" href="https://www.airbnb.it/users/show/{{ owner.room_owner_id }}">{{ owner.room_owner  }} ({{ owner.total_beds  }})</a>
                </tag>  
        </div>
        
        <div class="col-xs-4" style="font-size: 1em; font-weight: bold;"> 
                <tag ng-repeat="owner in airbnb_values.top10_isole | limitTo:10   track by $index  " > 
                      <br>&nbsp;<a target="_blank" href="https://www.airbnb.it/users/show/{{ owner.room_owner_id }}">{{ owner.room_owner  }} ({{ owner.total_beds  }})</a>
                </tag>   
        </div>
        
        <div class="col-xs-4" style="font-size: 1em; font-weight: bold;"> 
                    <tag style="padding-left: 5px;" ng-repeat="owner in airbnb_values.top10_mestre | limitTo:10  track by $index  " > 
				      <br>&nbsp;<a target="_blank" href="https://www.airbnb.it/users/show/{{ owner.room_owner_id }}">{{ owner.room_owner  }} ({{ owner.total_beds  }})</a>
                    </tag>  
        </div>          
    </div>     
</div>
