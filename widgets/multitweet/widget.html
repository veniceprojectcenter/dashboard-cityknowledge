<script src="widgets/multitweet/multitweet.js"></script>

<div style="height: 340px; width:371px; overflow-y: scroll;"> 
  <div class="multitweet_container">
    <span style="display: none">
      PIPPO - {{indice}}
      <span ng-repeat="test in datix">
        {{test.immagine}}
      </span>
    </span>
    <div ng-repeat="tweet in data_multitweet.tweets">
      <img src="{{tweet.user.profile_image_url}}" width="30px" height="30px" />
      <a target="_blank" href="https://twitter.com/{{tweet.user.screen_name}}">@{{tweet.user.screen_name}}</a>
      <span>{{tweet.text}}</span>
    </div>
  </div>
</div>
