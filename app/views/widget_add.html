<div class="modal fade add-widget">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title">Add Widget to Dashboard</h4>
      </div>
      <div class="modal-body">
        <form class="form-horizontal" role="form">
          <div class="form-group">
            <label htm class="col-sm-4 control-label">Choose Widget</label>
            <div class="col-sm-8">
              <select class="form-control" ng-model='widgetToAdd' ng-options="widget.title for widget in widgets | orderBy: 'title' track by widget.id"></select>
            </div>
          </div>
        </form>
        <button class="btn btn-primary" ng-click='addSelectedWidget()'>Add Widget</button>
        <br /><br />
      </div>
    </div>
  </div>
</div>
