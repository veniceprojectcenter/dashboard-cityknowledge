<div class="modal fade widget-config">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title">{{settingsWidget.title}} Settings</h4>
      </div>
      <div class="modal-body">
        <tabset>
          <tab heading="General Settings">
            <form class="form-horizontal" role="form">
              <div class="form-group">
                <label class="col-sm-4 control-label">Title</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" placeholder="Title" ng-model='settingsWidget.title' debounce='500' />
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-4 control-label">URL Title</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" placeholder="URL Title" ng-model='settingsWidget.urlTitle' debounce='500' />
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-4 control-label">URL</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" placeholder="URL" ng-model='settingsWidget.url' debounce='500' />
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-4 control-label">Help Doc URL</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" placeholder="Help Doc URL" ng-model='settingsWidget.helpDocUrl' debounce='500' />
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-4 control-label">Width</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" placeholder="Help Doc URL" ng-model='settingsWidget.width' debounce='500' />
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-4 control-label">Height</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" placeholder="Help Doc URL" ng-model='settingsWidget.height' debounce='500' />
                </div>
              </div>
            </form>
          </tab>
          <tab heading="Specific Settings">
            <div ng-show="settingsWidget.specific_settings">
              <ng-include src="widgetSettingPartial(settingsWidget)"></ng-include>
            </div>
            <form ng-hide="settingsWidget.specific_settings" class="form-horizontal" role="form">
              <div class="form-group" ng-repeat='setting in settingsWidget.settings'>
                <label class="col-sm-4 control-label">{{setting.label}}</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" placeholder="{{setting.label}}" ng-model='setting.value' debounce="500" data-setting_label="{{setting.label}}" />
                </div>
              </div>
            </form>
          </tab>
          <tab heading="Updates">

          </tab>
          <tab heading="Log">

          </tab>
        </tabset>
        <button class="btn btn-primary save-btn" ng-click='saveSettings()'>Save Settings</button>
        <br /><br />
      </div>
    </div>
  </div>
</div>
