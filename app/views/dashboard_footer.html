<div class='left-section'>
  <div class='message' ng-bind-html='htmlSafe(dashboardSettings.footerMessage)'></div>
</div>
<div class='right-section'>
  <div class='logos'>
    <span class='logo'>
      <a ng-repeat='logo in dashboardSettings.logos' href='{{logo.url}}' target='_new'>
        <img class='logo' src='img/{{logo.file}}' height="30" />
      </a>
    </span>
  </div>
</div>
