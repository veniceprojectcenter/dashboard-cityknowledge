<div class="modal fade dashboard-help">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title">Dashboard Help</h4>
      </div>
      <div class="modal-body">
        <iframe ng-src="{{trustSrc(dashboardSettings.helpDocUrl)}}" scrolling="no" width='{{dashboardSettings.helpDocWidth}}' height='{{dashboardSettings.helpDocHeight}}' frameBorder="0"></iframe>
      </div>
    </div>
  </div>
</div>
