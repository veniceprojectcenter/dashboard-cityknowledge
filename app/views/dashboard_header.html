 
        <div class='left-section'>
          
          <div class='main-title'>{{dashboardSettings.name}}</div>
          <div class='subtitle'>{{dashboardSettings.subtitle}} {{dashboardSettings.showHeader}}</div>
        </div>
        <div class='right-section'>
          <div class='account-links'>
            <span ng-show='loggedIn'>
              <span class="glyphicon glyphicon-user glyphicon-small"></span>
              <a >{{user.email}}</a> |
              <a ng-click='logoutUser()'>Sign Out</a>
            </span>
            <span ng-hide='loggedIn'>
              <a data-toggle='modal' data-target='.login'>log-in</a> |
              <a data-toggle='modal' data-target='.register'>sign-up</a> 
            </span>
             | 
            <a href="javascript:;" data-toggle="collapse"  data-target=".showheader-bar">X</a>
          </div>
          <div class='clock'>
            {{clock}}
          </div>
          <div class='header-buttons'>
            <div class="btn-group">
              <div class="btn-group">
                <button type="button" class="btn btn-default" data-toggle="modal" data-target=".add-widget" ng-show='isOwner'>
                  <span class="glyphicon glyphicon-plus"></span>
                </button>
                <button type="button" class="btn btn-default" data-toggle="modal" data-target=".dashboard-settings" ng-show='isOwner'>
                  <span class="glyphicon glyphicon-cog"></span>
                </button>
                <button type="button" class="btn btn-default" data-toggle="modal" data-target=".dashboard-help">
                  <span class="glyphicon glyphicon-question-sign"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
