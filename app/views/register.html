<div class="modal fade register">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title">Register Dashboard Account</h4>
      </div>
      <div class="modal-body">
        <div class='modal-message'></div>
        <form class="form-horizontal" role="form">
          <div class="col-sm-1"></div>
          <div class="form-group">
            <label class="col-sm-2 control-label">Email</label>
            <div class="col-sm-7">
              <input type="email" class="form-control" placeholder="Email" ng-model='user.email' />
            </div>
          </div>
          <div class="col-sm-1"></div>
          <div class="form-group">
            <label class="col-sm-2 control-label">Password</label>
            <div class="col-sm-7">
              <input type="password" class="form-control" placeholder="Password" ng-model='user.password' />
            </div>
          </div>
          <div class="col-sm-1"></div>
          <div class="form-group">
            <label class="col-sm-2 control-label">Confirm Password</label>
            <div class="col-sm-7">
              <input type="password" class="form-control" placeholder="Confirm Password" ng-model='user.passwordconfirm' />
            </div>
          </div>
          <div class="col-sm-1"></div>
          <div class="form-group">
            <div class="col-sm-offset-2 col-sm-7">
              <button type="button" class="btn btn-primary login-btn" ng-click='registerUser()'>Register Account</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
