<div class="modal fade login">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title">Login to Your Dashboard</h4>
      </div>
      <div class="modal-body">
        <div class="modal-message"></div>
        <form class="form-horizontal" role="form">
          <div class="col-sm-1"></div>
          <div class="form-group">
            <label class="col-sm-2 control-label">Email</label>
            <div class="col-sm-7">
              <input type="email" class="form-control" placeholder="Email" ng-model='user.email' />
            </div>
          </div>
          <div class="col-sm-1"></div>
          <div class="form-group">
            <label class="col-sm-2 control-label">Password</label>
            <div class="col-sm-7">
              <input type="password" class="form-control" placeholder="Password" ng-model='user.password' />
            </div>
          </div>
          <!-- div class="col-sm-1"></div>
          <div class="form-group">
            <div class="col-sm-offset-2 col-sm-7">
              <div class="checkbox">
                <label>
                  <input type="checkbox" /> Remember me
                </label>
              </div>
            </div>
          </div -->
          <div class="col-sm-1"></div>
          <div class="form-group">
            <div class="col-sm-offset-2 col-sm-7">
              <button type='button' class="btn btn-primary login-btn" ng-click='loginUser()'>Login</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
